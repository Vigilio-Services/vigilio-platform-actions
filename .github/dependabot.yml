version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_GITHUB_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    registries:
      - github-packages
    groups:
      node-tooling:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
    groups:
      github-actions:
        patterns:
          - '*'
