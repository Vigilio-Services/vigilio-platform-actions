name: terraform-drift

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      working-directory:
        type: string
        required: true
      backend-config:
        type: string
        required: true
      var-file:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      terraform-version:
        type: string
        required: false
        default: 1.15.8
      conftest-version:
        type: string
        required: false
        default: 0.62.0
      policy-directory:
        type: string
        required: false
        default: infra/policies/conftest
    secrets:
      AWS_ROLE_ARN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Terraform drift (${{ inputs.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Require an immutable environment contract
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          BACKEND_CONFIG: ${{ inputs.backend-config }}
          STAGE: ${{ inputs.stage }}
          VAR_FILE: ${{ inputs.var-file }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "${STAGE}" in development|staging|production) ;; *) echo "Invalid stage: ${STAGE}"; exit 1 ;; esac
          # Consumers may keep a state boundary at a component root while
          # storing its reviewed, stage-specific backend and vars elsewhere.
          # Validate the supplied contract instead of imposing one layout.
          test -d "${WORKING_DIRECTORY}" || {
            echo "Terraform working directory not found: ${WORKING_DIRECTORY}"; exit 1;
          }
          test -n "${AWS_ROLE_ARN}" || { echo 'A read-only AWS drift role ARN is required'; exit 1; }
          test -f "${BACKEND_CONFIG}" || { echo "Missing backend config: ${BACKEND_CONFIG}"; exit 1; }
          test -f "${VAR_FILE}" || { echo "Missing var file: ${VAR_FILE}"; exit 1; }
          if grep -q 'REPLACE_WITH_' "${BACKEND_CONFIG}" "${VAR_FILE}"; then
            echo 'Backend or variable configuration still contains placeholders'; exit 1
          fi
      - name: Prepare Terraform provider cache
        shell: bash
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"
      # A failed drift check must not promote an incomplete provider download.
      - name: Restore verified provider cache
        id: provider_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-shared-drift-v3-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-drift-${{ inputs.stage }}-${{ github.run_id }}
          unset-current-credentials: true
      - name: Initialize and validate
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -input=false -lockfile=readonly -backend-config="${BACKEND_CONFIG}"
          terraform validate
      - name: Detect drift
        id: plan
        shell: bash
        env:
          VAR_FILE: ${{ inputs.var-file }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -lock=false -refresh=true \
            -var-file="${VAR_FILE}" -out=tfplan > tfplan.txt 2>&1
          status=$?
          set -e
          case "${status}" in
            0) echo 'drift=false' >> "${GITHUB_OUTPUT}" ;;
            2) echo 'drift=true' >> "${GITHUB_OUTPUT}" ;;
            *) cat tfplan.txt; exit "${status}" ;;
          esac
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.review.txt
      - name: Install Conftest with checksum verification
        if: steps.plan.outputs.drift == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base}/${archive}"
          curl --fail --location --silent --show-error --output checksums.txt "${base}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "${archive}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
        env:
          CONFTEST_VERSION: ${{ inputs.conftest-version }}
      - name: Evaluate drift against policy
        if: steps.plan.outputs.drift == 'true'
        run: conftest test tfplan.json --policy "${GITHUB_WORKSPACE}/${POLICY_DIRECTORY}"
        env:
          POLICY_DIRECTORY: ${{ inputs.policy-directory }}
      - name: Publish drift summary
        if: always() && steps.plan.outcome != 'skipped'
        shell: bash
        env:
          DRIFT: ${{ steps.plan.outputs.drift }}
          STAGE: ${{ inputs.stage }}
        run: |
          {
            echo "## Terraform drift: ${STAGE}"
            echo
            if [ "${DRIFT}" = 'true' ]; then
              echo 'Drift detected. Review the attached redacted plan and reconcile through the normal plan/apply path.'
            else
              echo 'No drift detected.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terraform-drift-${{ inputs.stage }}-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/tfplan.review.txt
            ${{ inputs.working-directory }}/tfplan.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when drift exists
        if: steps.plan.outputs.drift == 'true'
        run: |
          echo 'Terraform drift detected; this run intentionally fails to trigger the configured alerting path.'
          exit 1
      - name: Remove raw drift plan material
        if: always()
        shell: bash
        run: rm -f tfplan tfplan.json tfplan.txt tfplan.review.txt
      - name: Save verified provider cache
        if: ${{ success() && steps.provider_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-shared-drift-v3-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
