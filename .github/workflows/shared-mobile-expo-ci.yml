name: mobile-expo-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      run-export:
        type: boolean
        required: false
        default: true
      app-name:
        type: string
        required: false
        default: mobile-app
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dd079500832c8b9cadefcd6dff90223aa7922ed3 # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          github-packages-token: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
          install: false
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/.cache/jest
            ${{ inputs.working-directory }}/.expo
            ${{ inputs.working-directory }}/node_modules/.cache
            ~/.expo
          key: mobile-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
      - run: pnpm governance:package-manager
      - run: pnpm governance:repository
      - run: pnpm governance:github-actions
      - run: pnpm governance:env
      - run: pnpm governance:contracts
      - run: pnpm run --if-present governance:environments
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm expo:check
      - run: pnpm expo:doctor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.app-name }}-coverage
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 14

  export:
    name: Expo Export
    needs: quality
    if: inputs.run-export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dd079500832c8b9cadefcd6dff90223aa7922ed3 # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          github-packages-token: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
          install: false
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/.expo
            ${{ inputs.working-directory }}/node_modules/.cache
            ~/.expo
          key: mobile-export-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
      - run: pnpm export
      - run: pnpm export:budget
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app-name }}-dist
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app-name }}-sbom
          path: ${{ inputs.working-directory }}/reports/sbom.cdx.json
          retention-days: 30
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ inputs.working-directory }}/dist/**
            ${{ inputs.working-directory }}/reports/sbom.cdx.json
