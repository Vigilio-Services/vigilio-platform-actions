name: backend-node-nest-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      has-postgres:
        type: boolean
        required: false
        default: true
      has-cdk:
        type: boolean
        required: false
        default: false
      has-openapi:
        type: boolean
        required: false
        default: true
      run-bdd:
        type: boolean
        required: false
        default: true
      run-unit-tests:
        type: boolean
        required: false
        default: true
      run-build:
        type: boolean
        required: false
        default: true
      run-e2e:
        type: boolean
        required: false
        default: true
      e2e-script:
        type: string
        required: false
        default: test:e2e
      run-aws-integration:
        type: boolean
        required: false
        default: false
      run-browser-e2e:
        type: boolean
        required: false
        default: false
      run-security-deep:
        type: boolean
        required: false
        default: true
      attest-artifact:
        type: boolean
        required: false
        default: false
      semgrep-version:
        type: string
        required: false
        default: '1.165.0'
      jira-enabled:
        type: boolean
        required: false
        default: false
      jira-transition-code-review:
        type: string
        required: false
        default: ''
      gitops-bot-actor:
        type: string
        required: false
        default: github-actions[bot]
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_USER_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: ${{ inputs.node-version }}
  PNPM_VERSION: ${{ inputs.pnpm-version }}
  WORKING_DIRECTORY: ${{ inputs.working-directory }}

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: ./actions/ # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm audit --audit-level=high
      - name: Validate branch name
        if: github.event_name != 'merge_group'
        run: pnpm exec vigilio-governance validate-branch-name --branch-name "$BRANCH_NAME" --actor "$ACTOR" --trusted-gitops-actor "$TRUSTED_GITOPS_ACTOR"
        env:
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          TRUSTED_GITOPS_ACTOR: ${{ inputs.gitops-bot-actor }}
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: pnpm exec vigilio-governance validate-pr-title --title "$PR_TITLE" --branch-name "$BRANCH_NAME" --actor "$ACTOR" --trusted-gitops-actor "$TRUSTED_GITOPS_ACTOR"
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TRUSTED_GITOPS_ACTOR: ${{ inputs.gitops-bot-actor }}
      - name: Validate PR body and risk evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.txt"
          pnpm exec vigilio-governance validate-pr-body --body-file "$RUNNER_TEMP/pr-body.txt"
          pnpm exec vigilio-governance validate-pr-risk --body-file "$RUNNER_TEMP/pr-body.txt"
      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BRANCH_NAME: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_GITOPS_ACTOR: ${{ inputs.gitops-bot-actor }}
        run: |
          set -euo pipefail
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)" fetch origin "${BASE_REF}"
          git log "origin/${BASE_REF}..HEAD" --format="%an|%s" | while IFS="|" read -r commit_author message; do
            test -z "${message}" || pnpm exec vigilio-governance validate-commit-message --message "${message}" --branch-name "${BRANCH_NAME}" --actor "${commit_author}" --trusted-gitops-actor "${TRUSTED_GITOPS_ACTOR}"
          done
      - name: Move Jira issue to code review
        if: github.event_name == 'pull_request' && inputs.jira-enabled && inputs.jira-transition-code-review != ''
        uses: ./actions/ # v1
        with:
          mode: transition
          issue-keys: ${{ github.head_ref }} ${{ github.event.pull_request.title }}
          transition-name: ${{ inputs.jira-transition-code-review }}
          comment: Pull Request opened or updated ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Synthesize CloudFormation for policy scan
        if: github.event_name == 'pull_request' && inputs.has-cdk
        run: pnpm cdk:synth
      - name: Checkov IaC security
        if: github.event_name == 'pull_request' && inputs.has-cdk
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: ${{ inputs.working-directory }}/cdk.out
          framework: cloudformation
          quiet: true
          soft_fail: false

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm lint
      - run: pnpm typecheck
      - if: inputs.run-unit-tests
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 14

  integration:
    name: PostgreSQL Integration
    needs: [governance, quality]
    if: inputs.has-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm drizzle:check
      - run: pnpm test:integration
        env:
          E2E_AUTO_START_POSTGRES: 'false'
          E2E_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          E2E_DATABASE_NAME: backend_integration
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/backend_integration

  integration-aws:
    name: AWS Local Integration
    needs: [governance, quality]
    if: inputs.run-aws-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm test:integration:aws:ci

  bdd:
    name: BDD
    needs: [governance, quality]
    if: inputs.run-bdd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm test:bdd

  contract:
    name: OpenAPI Contract
    needs: [governance, quality]
    if: inputs.has-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm openapi:export
      - run: pnpm openapi:diff
        env:
          OPENAPI_DIFF_REQUIRE_BASE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  e2e:
    name: API E2E
    needs: [quality, integration, contract]
    if: always() && inputs.run-e2e && needs.quality.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') && (needs.contract.result == 'success' || needs.contract.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Run selected API E2E profile
        shell: bash
        run: |
          set -euo pipefail
          case "${E2E_SCRIPT}" in
            test:e2e|test:e2e:critical|test:e2e:smoke) ;;
            *) echo "Unsupported E2E script: ${E2E_SCRIPT}"; exit 1 ;;
          esac
          pnpm run "${E2E_SCRIPT}"
        env:
          E2E_SCRIPT: ${{ inputs.e2e-script }}
          E2E_AUTO_START_POSTGRES: 'false'
          E2E_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          E2E_DATABASE_NAME: backend_e2e
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/backend_e2e

  e2e-browser:
    name: Browser E2E
    needs: [governance, quality]
    if: inputs.run-browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - uses: ./actions/ # v1
        with:
          working-directory: ${{ inputs.working-directory }}
      - run: pnpm test:e2e:browser

  infrastructure:
    name: CDK
    needs: [governance, quality]
    if: inputs.has-cdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm cdk:synth

  build:
    name: Build
    needs: [governance, quality, integration, integration-aws, bdd, contract, e2e, e2e-browser, infrastructure]
    if: always() && inputs.run-build && needs.governance.result == 'success' && needs.quality.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') && (needs.integration-aws.result == 'success' || needs.integration-aws.result == 'skipped') && (needs.bdd.result == 'success' || needs.bdd.result == 'skipped') && (needs.contract.result == 'success' || needs.contract.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') && (needs.e2e-browser.result == 'success' || needs.e2e-browser.result == 'skipped') && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-dist
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 30
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        if: inputs.attest-artifact
        with:
          subject-path: ${{ inputs.working-directory }}/dist/**

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security-deep:
    name: Deep Security Gate
    if: inputs.run-security-deep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: ./actions/ # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - if: inputs.has-cdk
        run: pnpm cdk:synth
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      - name: Semgrep
        shell: bash
        run: |
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: sarif
          output: ${{ inputs.working-directory }}/trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Trivy synthesized IaC
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: (success() || failure()) && inputs.has-cdk
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}/cdk.out
          format: sarif
          output: ${{ inputs.working-directory }}/trivy-iac.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles(format('{0}/semgrep.sarif', inputs.working-directory)) != '' }}
        with:
          sarif_file: ${{ inputs.working-directory }}/semgrep.sarif
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles(format('{0}/trivy-fs.sarif', inputs.working-directory)) != '' }}
        with:
          sarif_file: ${{ inputs.working-directory }}/trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles(format('{0}/trivy-iac.sarif', inputs.working-directory)) != '' }}
        with:
          sarif_file: ${{ inputs.working-directory }}/trivy-iac.sarif

  ci-gate:
    name: Required CI Gate
    needs: [governance, quality, integration, integration-aws, bdd, contract, e2e, e2e-browser, infrastructure, build, secret-scan, security-deep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required jobs
        shell: bash
        env:
          RUN_BUILD: ${{ inputs.run-build }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failures="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"${RESULTS}")"
          test -z "${failures}" || { echo "Required jobs failed: ${failures}"; exit 1; }
          test "$(jq -r '.quality.result' <<<"${RESULTS}")" = "success"
          if [ "${RUN_BUILD}" = "true" ]; then
            test "$(jq -r '.build.result' <<<"${RESULTS}")" = "success"
          else
            test "$(jq -r '.build.result' <<<"${RESULTS}")" = "skipped"
          fi
