name: shared-dora-metrics

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      window-days:
        type: number
        required: false
        default: 30
      environment:
        description: GitHub deployment environment used for DORA calculations.
        type: string
        required: false
        default: production
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  deployments: read
  packages: read

jobs:
  collect:
    name: Collect DORA metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: Vigilio-Services/vigilio-platform-actions/actions/configure-github-packages@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm devsecops:dora -- --environment "$DORA_ENVIRONMENT" --window-days "$WINDOW_DAYS"
        env:
          DORA_ENVIRONMENT: ${{ inputs.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ inputs.window-days }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dora-metrics-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/reports/dora-metrics.*
          if-no-files-found: error
          retention-days: 365
