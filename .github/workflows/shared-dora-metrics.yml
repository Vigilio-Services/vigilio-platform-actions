name: shared-dora-metrics

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      window-days:
        type: number
        required: false
        default: 30
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  deployments: read
  packages: read

jobs:
  collect:
    name: Collect DORA metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@a46b75d3bdac70b49596c7dbd8aebbbc3f6bb3ab # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@a46b75d3bdac70b49596c7dbd8aebbbc3f6bb3ab # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm devsecops:dora -- --window-days "$WINDOW_DAYS"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ inputs.window-days }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dora-metrics-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/reports/dora-metrics.*
          if-no-files-found: error
          retention-days: 365
