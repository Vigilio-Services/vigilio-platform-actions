name: terraform-plan

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      backend-config:
        type: string
        required: true
      var-file:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      terraform-version:
        type: string
        required: false
        default: 1.15.8
      conftest-version:
        type: string
        required: false
        default: 0.62.0
      policy-directory:
        type: string
        required: false
        default: infra/policies/conftest
      trivy-version:
        type: string
        required: false
        default: v0.72.0
      require-aws-role:
        type: boolean
        required: false
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      PLAN_AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Require plan identity and configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ env.PLAN_AWS_ROLE_ARN }}
          REQUIRE_ROLE: ${{ inputs.require-aws-role }}
          BACKEND_CONFIG: ${{ inputs.backend-config }}
          VAR_FILE: ${{ inputs.var-file }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            if [[ "${REQUIRE_ROLE}" == "true" ]]; then
              echo 'An AWS OIDC role ARN is required'; exit 1;
            else
              # TECH DEBT: Running terraform init with -backend=false and skipping plan/conftest is a dry-run fallback for PRs without AWS credentials.
              echo '::warning::AWS_ROLE_ARN not provided — running Terraform dry-run validation without remote AWS authentication'
            fi
          fi
          test -f "${BACKEND_CONFIG}" || { echo "Terraform backend config not found: ${BACKEND_CONFIG}"; exit 1; }
          test -f "${VAR_FILE}" || { echo "Terraform var file not found: ${VAR_FILE}"; exit 1; }
      - name: Prepare Terraform provider cache
        shell: bash
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"
      # Restore and save are deliberately separate so a failed plan cannot
      # publish an incomplete provider download to later runs.
      - name: Restore verified provider cache
        id: provider_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-shared-plan-v3-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ env.PLAN_AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          unset-current-credentials: true
      - name: Verify formatting
        run: terraform fmt -check -recursive
      - name: Initialize backend
        run: |
          if [[ -n "${AWS_ROLE_ARN}" ]]; then
            terraform init -input=false -lockfile=readonly -backend-config="${BACKEND_CONFIG}"
          else
            terraform init -input=false -lockfile=readonly -backend=false
          fi
        env:
          AWS_ROLE_ARN: ${{ env.PLAN_AWS_ROLE_ARN }}
          BACKEND_CONFIG: ${{ inputs.backend-config }}
      - name: Validate configuration
        run: terraform validate
      - name: Create review plan
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        run: terraform plan -input=false -lock-timeout=5m -var-file="${VAR_FILE}" -out=tfplan
        env:
          VAR_FILE: ${{ inputs.var-file }}
      - name: Render plan for policy and review
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        run: |
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt
      - name: Install Conftest with checksum verification
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base}/${archive}"
          curl --fail --location --silent --show-error --output checksums.txt "${base}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "${archive}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
        env:
          CONFTEST_VERSION: ${{ inputs.conftest-version }}
      - name: Enforce Terraform policies
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        run: conftest test tfplan.json --policy "${GITHUB_WORKSPACE}/${POLICY_DIRECTORY}"
        env:
          POLICY_DIRECTORY: ${{ inputs.policy-directory }}
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ inputs.trivy-version }}
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload redacted review evidence
        if: inputs.aws-role-arn != '' || env.PLAN_AWS_ROLE_ARN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ inputs.working-directory }}/tfplan.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Remove raw plan material
        if: always()
        shell: bash
        run: rm -f tfplan tfplan.json tfplan.txt
      - name: Save verified provider cache
        if: ${{ success() && steps.provider_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-shared-plan-v3-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
