name: desktop-tauri-build

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      allow-release-for-staging:
        type: boolean
        required: false
        default: true
    secrets:
      VITE_API_BASE_URL:
        required: true

permissions:
  contents: read
  packages: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: ${{ inputs.stage }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/validate-stage-source@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          stage: ${{ inputs.stage }}
          ref-name: ${{ github.ref_name }}
          allow-release-for-staging: ${{ inputs.allow-release-for-staging && 'true' || 'false' }}
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm governance:package-manager
      - run: pnpm governance:env
      - run: pnpm governance:contracts
      - run: pnpm governance:tauri
      - run: pnpm governance:testing
      - run: pnpm governance:release
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm rust:fmt
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm build
        env:
          VITE_STAGE: ${{ inputs.stage }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - run: pnpm bundle:budget
        env:
          VITE_STAGE: ${{ inputs.stage }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - run: pnpm sbom:generate
        env:
          VITE_STAGE: ${{ inputs.stage }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - run: pnpm tauri:build
        env:
          VITE_STAGE: ${{ inputs.stage }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-${{ matrix.os }}-${{ inputs.stage }}
          path: |
            ${{ inputs.working-directory }}/src-tauri/target/release/bundle/**
            ${{ inputs.working-directory }}/reports/sbom.cdx.json
          retention-days: 30
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ inputs.working-directory }}/src-tauri/target/release/bundle/**
            ${{ inputs.working-directory }}/reports/sbom.cdx.json
