name: backend-node-nest-deploy-cdk

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: false
        default: backend
      stage:
        type: string
        required: true
      deploy-mode:
        type: string
        required: false
        default: plan
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      aws-region:
        type: string
        required: false
        default: us-east-1
      run-smoke:
        type: boolean
        required: false
        default: true
      attest-artifact:
        type: boolean
        required: false
        default: false
      run-dast:
        type: boolean
        required: false
        default: false
      governance-command:
        type: string
        required: false
        default: pnpm governance:package-manager && pnpm governance:github-actions
      quality-command:
        type: string
        required: false
        default: pnpm audit --audit-level=high && pnpm lint && pnpm typecheck && pnpm test:coverage:ci
      contract-command:
        type: string
        required: false
        default: pnpm openapi:export && pnpm openapi:diff
      cdk-synth-command:
        type: string
        required: false
        default: pnpm cdk synth
      cdk-diff-command:
        type: string
        required: false
        default: pnpm cdk diff --all
      cdk-deploy-command:
        type: string
        required: false
        default: pnpm cdk deploy --all
      build-command:
        type: string
        required: false
        default: pnpm build
      evidence-command:
        type: string
        required: false
        default: pnpm evidence:operational
      provenance-command:
        type: string
        required: false
        default: pnpm devsecops:provenance
      sign-provenance:
        type: boolean
        required: false
        default: true
      archive-evidence:
        type: boolean
        required: false
        default: true
      smoke-command:
        type: string
        required: false
        default: pnpm smoke:endpoints
      jira-enabled:
        type: boolean
        required: false
        default: false
      jira-required:
        type: boolean
        required: false
        default: false
      jira-project-key:
        type: string
        required: false
        default: ''
      jira-issue-keys:
        type: string
        required: false
        default: ''
      jira-transition-name:
        type: string
        required: false
        default: ''
      jira-official-deployments-api:
        type: boolean
        required: false
        default: false
    # Secrets are dynamically resolved natively via 'environment: ${{ inputs.stage }}'
    # Do not declare them here to avoid caller-scope validation errors.

permissions:
  actions: read
  contents: read
  packages: read

env:
  APP_NAME: ${{ inputs.app-name }}
  AWS_REGION: ${{ inputs.aws-region }}
  NODE_VERSION: ${{ inputs.node-version }}
  PNPM_VERSION: ${{ inputs.pnpm-version }}
  STAGE: ${{ inputs.stage }}

jobs:
  preflight:
    name: Preflight ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-digest: ${{ steps.upload-deployable.outputs.artifact-digest }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/validate-stage-source@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          stage: ${{ inputs.stage }}
          ref-name: ${{ github.ref_name }}
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate deploy policy
        shell: bash
        env:
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
        run: |
          set -euo pipefail
          case "${DEPLOY_MODE}" in
            plan|apply) ;;
            *) echo "Unsupported deploy mode: ${DEPLOY_MODE}"; exit 1 ;;
          esac
          if [[ "${DEPLOY_MODE}" == "apply" && "${STAGE}" =~ ^(staging|preproduction|production)$ && "${RUN_SMOKE}" != "true" ]]; then
            echo "Smoke checks are mandatory for ${STAGE} apply deployments"
            exit 1
          fi
      - name: Governance
        run: eval "$GOVERNANCE_CMD"
        env:
          GOVERNANCE_CMD: ${{ inputs.governance-command }}
      - name: Quality gates
        run: eval "$QUALITY_CMD"
        env:
          QUALITY_CMD: ${{ inputs.quality-command }}
      - name: Contract gates
        run: eval "$CONTRACT_CMD"
        env:
          CONTRACT_CMD: ${{ inputs.contract-command }}
      - name: CDK synth
        run: eval "$CDK_SYNTH_CMD --context stage=$STAGE"
        env:
          CDK_SYNTH_CMD: ${{ inputs.cdk-synth-command }}
      - name: Build
        run: eval "$BUILD_CMD"
        env:
          BUILD_CMD: ${{ inputs.build-command }}
      - run: mkdir -p reports
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: cyclonedx
          output: ${{ inputs.working-directory }}/reports/sbom-${{ inputs.stage }}.cdx.json
      - name: Generate artifact digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          paths=(dist cdk.out "reports/sbom-${STAGE}.cdx.json")
          [[ -e docs/openapi/openapi.json ]] && paths+=(docs/openapi/openapi.json)
          [[ -d drizzle ]] && paths+=(drizzle)
          find "${paths[@]}" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "reports/artifact-digests-${STAGE}.txt"
      - name: Generate SLSA provenance
        run: eval "$PROVENANCE_CMD"
        env:
          PROVENANCE_CMD: ${{ inputs.provenance-command }}
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
      - name: Write preflight operational evidence
        run: eval "$EVIDENCE_CMD"
        env:
          EVIDENCE_CMD: ${{ inputs.evidence-command }}
          EVIDENCE_PHASE: preflight
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
      - name: Upload immutable deployable artifact
        id: upload-deployable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ inputs.working-directory }}/cdk.out/
            ${{ inputs.working-directory }}/dist/
            ${{ inputs.working-directory }}/docs/openapi/openapi.json
            ${{ inputs.working-directory }}/reports/sbom-${{ inputs.stage }}.cdx.json
            ${{ inputs.working-directory }}/reports/artifact-digests-${{ inputs.stage }}.txt
            ${{ inputs.working-directory }}/reports/slsa-provenance-${{ inputs.stage }}.intoto.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-preflight-evidence
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/cdk.out/
            ${{ inputs.working-directory }}/dist/
            ${{ inputs.working-directory }}/docs/openapi/openapi.json
            ${{ inputs.working-directory }}/reports/
          retention-days: 30

  attest:
    name: Attest ${{ inputs.stage }} artifact
    needs: preflight
    if: inputs.attest-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download immutable deployable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.sha }}
          path: artifact
      - name: Attest deployable artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifact/**

  deploy:
    name: Deploy ${{ inputs.stage }}
    needs: [preflight, attest]
    if: always() && needs.preflight.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    environment: ${{ inputs.stage }}
    concurrency:
      group: ${{ inputs.app-name }}-${{ inputs.stage }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download immutable deployable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}
      - name: Verify deployable artifact
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "reports/artifact-digests-${STAGE}.txt"
          printf '%s  %s\n' "${{ needs.preflight.outputs.artifact-digest }}" \
            "github-actions-artifact" > "reports/artifact-container-digest-${STAGE}.txt"
      - name: Require isolated signing configuration
        if: inputs.deploy-mode == 'apply' && inputs.sign-provenance
        shell: bash
        env:
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          COSIGN_KMS_KEY_URI: ${{ secrets.COSIGN_KMS_KEY_URI }}
        run: |
          set -euo pipefail
          test -n "${AWS_SIGNING_ROLE_ARN}" || { echo "AWS_SIGNING_ROLE_ARN is required"; exit 1; }
          test -n "${COSIGN_KMS_KEY_URI}" || { echo "COSIGN_KMS_KEY_URI is required"; exit 1; }
      - name: Configure isolated signing role
        if: inputs.deploy-mode == 'apply' && inputs.sign-provenance
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws-region }}
          role-session-name: ${{ inputs.app-name }}-${{ inputs.stage }}-sign-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
      - name: Install Cosign
        if: inputs.deploy-mode == 'apply' && inputs.sign-provenance
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify deployment provenance
        if: inputs.deploy-mode == 'apply' && inputs.sign-provenance
        shell: bash
        env:
          COSIGN_KMS_KEY_URI: ${{ secrets.COSIGN_KMS_KEY_URI }}
        run: |
          set -euo pipefail
          for document in \
            "reports/artifact-digests-${STAGE}.txt" \
            "reports/slsa-provenance-${STAGE}.intoto.json"; do
            signature="${document}.sig"
            cosign sign-blob --yes --tlog-upload=false --key "${COSIGN_KMS_KEY_URI}" \
              --output-signature "${signature}" "${document}"
            cosign verify-blob --insecure-ignore-tlog --key "${COSIGN_KMS_KEY_URI}" \
              --signature "${signature}" "${document}"
          done
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws-region }}
          role-session-name: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          unset-current-credentials: true
      - name: CDK diff evidence
        shell: bash
        env:
          CDK_DIFF_CMD: ${{ inputs.cdk-diff-command }}
        run: |
          set -euo pipefail
          mkdir -p reports
          eval "$CDK_DIFF_CMD --app cdk.out" 2>&1 | tee "reports/cdk-diff-${STAGE}.txt"
      - name: CDK deploy
        if: inputs.deploy-mode == 'apply'
        env:
          CDK_DEPLOY_CMD: ${{ inputs.cdk-deploy-command }}
        run: eval "$CDK_DEPLOY_CMD --app cdk.out"
      - name: Write rollback target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > "reports/rollback-target-${STAGE}.json" <<JSON
          {
            "stage": "${STAGE}",
            "current_sha": "${GITHUB_SHA}",
            "previous_sha": "${ROLLBACK_TARGET_SHA}",
            "strategy": "redeploy last known good artifact or revert and redeploy from main",
            "owner": "platform"
          }
          JSON
        env:
          ROLLBACK_TARGET_SHA: ${{ github.event.before || '' }}
      - name: Write deploy operational evidence
        run: ${{ inputs.evidence-command }}
        env:
          EVIDENCE_PHASE: deploy
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      - name: Archive evidence to S3 Object Lock
        if: inputs.deploy-mode == 'apply' && inputs.archive-evidence && vars.AUDIT_EVIDENCE_BUCKET != ''
        shell: bash
        env:
          AUDIT_EVIDENCE_BUCKET: ${{ vars.AUDIT_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          lock_status="$(aws s3api get-object-lock-configuration \
            --bucket "${AUDIT_EVIDENCE_BUCKET}" \
            --query 'ObjectLockConfiguration.ObjectLockEnabled' \
            --output text)"
          test "${lock_status}" = "Enabled" || {
            echo "AUDIT_EVIDENCE_BUCKET must have S3 Object Lock enabled"
            exit 1
          }
          prefix="${GITHUB_REPOSITORY}/${STAGE}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp reports/ "s3://${AUDIT_EVIDENCE_BUCKET}/${prefix}/" \
            --recursive \
            --only-show-errors
      - name: Extract Jira issue keys
        id: jira_keys
        if: inputs.jira-enabled
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JIRA_ISSUE_KEYS}" ]; then
            issue_keys="${JIRA_ISSUE_KEYS}"
          else
            range="${GITHUB_EVENT_BEFORE:-}..${GITHUB_SHA}"
            if [ -z "${GITHUB_EVENT_BEFORE:-}" ] || [ "${GITHUB_EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              range="${GITHUB_SHA}~20..${GITHUB_SHA}"
            fi
            issue_keys="$(git log --format=%B "${range}" 2>/dev/null | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | sort -u | paste -sd ',' - || true)"
          fi
          echo "issue_keys=${issue_keys}" >> "${GITHUB_OUTPUT}"
          echo "Jira issue keys: ${issue_keys:-none}"
        env:
          JIRA_ISSUE_KEYS: ${{ inputs.jira-issue-keys }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
      - name: Register Jira deployment
        if: inputs.deploy-mode == 'apply' && inputs.jira-enabled && steps.jira_keys.outputs.issue_keys != ''
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          mode: deployment
          issue-keys: ${{ steps.jira_keys.outputs.issue_keys }}
          environment: ${{ inputs.stage }}
          state: successful
          app-name: ${{ inputs.app-name }}
          deployment-id: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.sha }}
          deployment-name: ${{ inputs.app-name }} ${{ inputs.stage }}
          deployment-url: ${{ vars.APP_BASE_URL }}
          pipeline-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          repo: ${{ github.repository }}
          official-deployments-api: ${{ inputs.jira-official-deployments-api }}
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Move Jira issues after deployment
        if: inputs.deploy-mode == 'apply' && inputs.jira-enabled && inputs.jira-transition-name != '' && steps.jira_keys.outputs.issue_keys != ''
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          mode: transition
          issue-keys: ${{ steps.jira_keys.outputs.issue_keys }}
          transition-name: ${{ inputs.jira-transition-name }}
          comment: Deployed ${{ inputs.app-name }} to ${{ inputs.stage }}. Pipeline ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Create Jira incident on production deploy failure
        if: failure() && inputs.deploy-mode == 'apply' && inputs.jira-enabled && inputs.stage == 'production'
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          mode: incident
          project-key: ${{ inputs.jira-project-key }}
          summary: Production deploy failed for ${{ inputs.app-name }}
          description: Production deploy failed for ${{ inputs.app-name }} at commit ${{ github.sha }}. Pipeline ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-type: Bug
          priority: Highest
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-deploy-evidence
          path: |
            ${{ inputs.working-directory }}/cdk.out/
            ${{ inputs.working-directory }}/reports/
          retention-days: 90

  smoke:
    name: Smoke ${{ inputs.stage }}
    needs: deploy
    if: inputs.deploy-mode == 'apply' && inputs.run-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@b3b1e4ecf15f7720915e0a20d6da4036ce01f30a # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Smoke endpoints
        run: eval "$SMOKE_CMD"
        env:
          SMOKE_CMD: ${{ inputs.smoke-command }}
          API_BASE_URL: ${{ vars.APP_BASE_URL }}
      - name: Write smoke operational evidence
        run: eval "$EVIDENCE_CMD"
        env:
          EVIDENCE_CMD: ${{ inputs.evidence-command }}
          EVIDENCE_PHASE: smoke
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-smoke-evidence
          path: ${{ inputs.working-directory }}/reports/
          retention-days: 90

  dast:
    name: DAST ${{ inputs.stage }}
    needs: smoke
    if: inputs.deploy-mode == 'apply' && inputs.run-smoke && inputs.run-dast && (inputs.stage == 'staging' || inputs.stage == 'preproduction')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
    steps:
      - name: Require DAST target
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: test -n "${APP_BASE_URL}" || { echo "APP_BASE_URL is required for DAST"; exit 1; }
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          allow_issue_writing: false
          artifact_name: ${{ inputs.app-name }}-${{ inputs.stage }}-zap-${{ github.sha }}
          fail_action: true
          target: ${{ vars.APP_BASE_URL }}
