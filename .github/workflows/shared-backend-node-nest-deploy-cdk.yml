name: backend-node-nest-deploy-cdk

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: false
        default: backend
      stage:
        type: string
        required: true
      deploy-mode:
        type: string
        required: false
        default: plan
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.5.2'
      working-directory:
        type: string
        required: false
        default: .
      aws-region:
        type: string
        required: false
        default: us-east-1
      run-smoke:
        type: boolean
        required: false
        default: true
      governance-command:
        type: string
        required: false
        default: pnpm governance:package-manager && pnpm governance:github-actions
      quality-command:
        type: string
        required: false
        default: pnpm lint && pnpm typecheck && pnpm test:coverage:ci
      contract-command:
        type: string
        required: false
        default: pnpm openapi:export && pnpm openapi:diff
      cdk-synth-command:
        type: string
        required: false
        default: pnpm cdk synth
      cdk-diff-command:
        type: string
        required: false
        default: pnpm cdk diff --all
      cdk-deploy-command:
        type: string
        required: false
        default: pnpm cdk deploy --all
      build-command:
        type: string
        required: false
        default: pnpm build
      evidence-command:
        type: string
        required: false
        default: pnpm evidence:operational
      smoke-command:
        type: string
        required: false
        default: pnpm smoke:endpoints
      jira-enabled:
        type: boolean
        required: false
        default: false
      jira-required:
        type: boolean
        required: false
        default: false
      jira-project-key:
        type: string
        required: false
        default: ''
      jira-issue-keys:
        type: string
        required: false
        default: ''
      jira-transition-name:
        type: string
        required: false
        default: ''
      jira-official-deployments-api:
        type: boolean
        required: false
        default: false
    # Secrets are dynamically resolved natively via 'environment: ${{ inputs.stage }}'
    # Do not declare them here to avoid caller-scope validation errors.

permissions:
  contents: read
  packages: read
  id-token: write

env:
  APP_NAME: ${{ inputs.app-name }}
  AWS_REGION: ${{ inputs.aws-region }}
  NODE_VERSION: ${{ inputs.node-version }}
  PNPM_VERSION: ${{ inputs.pnpm-version }}
  STAGE: ${{ inputs.stage }}

jobs:
  preflight:
    name: Preflight ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/validate-stage-source@v1
        with:
          stage: ${{ inputs.stage }}
          ref-name: ${{ github.ref_name }}
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Governance
        run: ${{ inputs.governance-command }}
      - name: Quality gates
        run: ${{ inputs.quality-command }}
      - name: Contract gates
        run: ${{ inputs.contract-command }}
      - name: CDK synth
        run: ${{ inputs.cdk-synth-command }} --context stage=${{ inputs.stage }}
      - name: Build
        run: ${{ inputs.build-command }}
      - run: mkdir -p reports
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: cyclonedx
          output: ${{ inputs.working-directory }}/reports/sbom-${{ inputs.stage }}.cdx.json
      - name: Generate artifact digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          find dist docs/openapi cdk.out reports -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "reports/artifact-digests-${STAGE}.txt"
      - name: Write preflight operational evidence
        run: ${{ inputs.evidence-command }}
        env:
          EVIDENCE_PHASE: preflight
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-preflight-evidence
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/cdk.out/
            ${{ inputs.working-directory }}/dist/
            ${{ inputs.working-directory }}/docs/openapi/openapi.json
            ${{ inputs.working-directory }}/reports/
          retention-days: 30

  deploy:
    name: Deploy ${{ inputs.stage }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.stage }}
    concurrency:
      group: ${{ inputs.app-name }}-${{ inputs.stage }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-session-name: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: CDK diff evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          ${{ inputs.cdk-diff-command }} --context stage=${{ inputs.stage }} 2>&1 | tee "reports/cdk-diff-${STAGE}.txt"
      - name: CDK deploy
        if: inputs.deploy-mode == 'apply'
        run: ${{ inputs.cdk-deploy-command }} --context stage=${{ inputs.stage }}
      - name: Write rollback target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > "reports/rollback-target-${STAGE}.json" <<JSON
          {
            "stage": "${STAGE}",
            "current_sha": "${GITHUB_SHA}",
            "previous_sha": "${ROLLBACK_TARGET_SHA}",
            "strategy": "redeploy last known good artifact or revert and redeploy from main",
            "owner": "platform"
          }
          JSON
        env:
          ROLLBACK_TARGET_SHA: ${{ github.event.before || '' }}
      - name: Write deploy operational evidence
        run: ${{ inputs.evidence-command }}
        env:
          EVIDENCE_PHASE: deploy
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      - name: Extract Jira issue keys
        id: jira_keys
        if: inputs.jira-enabled
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JIRA_ISSUE_KEYS}" ]; then
            issue_keys="${JIRA_ISSUE_KEYS}"
          else
            range="${GITHUB_EVENT_BEFORE:-}..${GITHUB_SHA}"
            if [ -z "${GITHUB_EVENT_BEFORE:-}" ] || [ "${GITHUB_EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              range="${GITHUB_SHA}~20..${GITHUB_SHA}"
            fi
            issue_keys="$(git log --format=%B "${range}" 2>/dev/null | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | sort -u | paste -sd ',' - || true)"
          fi
          echo "issue_keys=${issue_keys}" >> "${GITHUB_OUTPUT}"
          echo "Jira issue keys: ${issue_keys:-none}"
        env:
          JIRA_ISSUE_KEYS: ${{ inputs.jira-issue-keys }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
      - name: Register Jira deployment
        if: inputs.deploy-mode == 'apply' && inputs.jira-enabled && steps.jira_keys.outputs.issue_keys != ''
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@v1
        with:
          mode: deployment
          issue-keys: ${{ steps.jira_keys.outputs.issue_keys }}
          environment: ${{ inputs.stage }}
          state: successful
          app-name: ${{ inputs.app-name }}
          deployment-id: ${{ inputs.app-name }}-${{ inputs.stage }}-${{ github.sha }}
          deployment-name: ${{ inputs.app-name }} ${{ inputs.stage }}
          deployment-url: ${{ vars.APP_BASE_URL }}
          pipeline-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          repo: ${{ github.repository }}
          official-deployments-api: ${{ inputs.jira-official-deployments-api }}
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Move Jira issues after deployment
        if: inputs.deploy-mode == 'apply' && inputs.jira-enabled && inputs.jira-transition-name != '' && steps.jira_keys.outputs.issue_keys != ''
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@v1
        with:
          mode: transition
          issue-keys: ${{ steps.jira_keys.outputs.issue_keys }}
          transition-name: ${{ inputs.jira-transition-name }}
          comment: Deployed ${{ inputs.app-name }} to ${{ inputs.stage }}. Pipeline ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Create Jira incident on production deploy failure
        if: failure() && inputs.deploy-mode == 'apply' && inputs.jira-enabled && inputs.stage == 'production'
        uses: VigilioYonatan/vigilio-platform-actions/actions/jira-devops@v1
        with:
          mode: incident
          project-key: ${{ inputs.jira-project-key }}
          summary: Production deploy failed for ${{ inputs.app-name }}
          description: Production deploy failed for ${{ inputs.app-name }} at commit ${{ github.sha }}. Pipeline ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-type: Bug
          priority: Highest
          required: ${{ inputs.jira-required }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-deploy-evidence
          path: |
            ${{ inputs.working-directory }}/cdk.out/
            ${{ inputs.working-directory }}/reports/
          retention-days: 90

  smoke:
    name: Smoke ${{ inputs.stage }}
    needs: deploy
    if: inputs.deploy-mode == 'apply' && inputs.run-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.stage }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Smoke endpoints
        run: ${{ inputs.smoke-command }}
        env:
          API_BASE_URL: ${{ vars.APP_BASE_URL }}
      - name: Write smoke operational evidence
        run: ${{ inputs.evidence-command }}
        env:
          EVIDENCE_PHASE: smoke
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_SMOKE: ${{ inputs.run-smoke }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.app-name }}-${{ inputs.stage }}-smoke-evidence
          path: ${{ inputs.working-directory }}/reports/
          retention-days: 90
