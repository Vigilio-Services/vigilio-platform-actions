name: shared-governance-audit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      enforce:
        type: boolean
        required: false
        default: false
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false
      GOVERNANCE_AUDIT_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: Audit GitHub governance drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@6ec57444f16f24b4168cfdd3695f5a54150281e0 # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@6ec57444f16f24b4168cfdd3695f5a54150281e0 # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Collect governance drift
        run: pnpm devsecops:governance-audit -- --report-only
        env:
          GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN || github.token }}
      - name: Enforce governance policy
        if: inputs.enforce
        shell: bash
        run: jq -e '.status == "compliant"' reports/github-governance-drift.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-governance-drift-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/reports/github-governance-drift.*
          if-no-files-found: error
          retention-days: 365
