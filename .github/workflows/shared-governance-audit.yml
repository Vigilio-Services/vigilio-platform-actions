name: shared-governance-audit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      enforce:
        type: boolean
        required: false
        default: false
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false
      GOVERNANCE_AUDIT_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: Audit GitHub governance drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          install: 'false'
      - uses: ./actions/configure-github-packages
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Collect governance drift
        run: pnpm devsecops:governance-audit -- --report-only
        env:
          GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN || github.token }}
      - name: Enforce governance policy
        if: inputs.enforce
        shell: bash
        run: jq -e '.status == "compliant"' reports/github-governance-drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-governance-drift-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/reports/github-governance-drift.*
          if-no-files-found: error
          retention-days: 365
