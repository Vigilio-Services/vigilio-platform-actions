name: platform-actions-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-actions-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'
  PYTHON_VERSION: '3.11'
  SEMGREP_VERSION: '1.165.0'

jobs:
  validate:
    name: Validate Platform Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Actionlint
        uses: reviewdog/action-actionlint@ab7138020abfe6cd20b742c82e5b7a9749fb5884 # v1.75.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-workspace.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm governance:workflows
      - run: pnpm governance:actions
      - name: Require changeset on package code changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED_PACKAGES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | grep -E '^packages/' || git diff --name-only HEAD~1...HEAD | grep -E '^packages/' || true)
          CHANGED_CHANGESETS=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | grep -E '^\.changeset/[^/]+\.md$' || git diff --name-only HEAD~1...HEAD | grep -E '^\.changeset/[^/]+\.md$' || true)
          if [ -n "${CHANGED_PACKAGES}" ] && [ -z "${CHANGED_CHANGESETS}" ]; then
            echo "Error: Code changes detected in packages/ without a declared .changeset/*.md file."
            echo "Please run 'pnpm changeset' locally and commit the resulting file."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsecops-governance-dist
          path: packages/devsecops-governance/dist/
          retention-days: 14

  package-smoke:
    name: Package Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: mkdir -p "${GITHUB_WORKSPACE}/reports"
      - run: pnpm test:packages
      - run: node packages/devsecops-governance/dist/cli.js validate-stage-source --stage production --ref-name main

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm --network=none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner /repo

  deep-security:
    name: Deep Security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: CodeQL init
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: vars.CODE_SCANNING_ENABLED == 'true'
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: vars.CODE_SCANNING_ENABLED == 'true'
      - name: Install Semgrep
        if: success() || failure()
        run: python -m pip install semgrep==${{ env.SEMGREP_VERSION }}
      - name: Semgrep OWASP scan
        if: success() || failure()
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif --error
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          limit-severities-for-sarif: true
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          limit-severities-for-sarif: true
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy-config.sarif') != '' }}
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload deep security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deep-security-sarif
          path: |
            semgrep.sarif
            trivy-fs.sarif
            trivy-config.sarif
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: Required CI Gate
    needs: [validate, package-smoke, secret-scan, deep-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce required jobs
        shell: bash
        env:
          DEEP_SECURITY_RESULT: ${{ needs.deep-security.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          for result in "${VALIDATE_RESULT}" "${PACKAGE_SMOKE_RESULT}" "${SECRET_SCAN_RESULT}" "${DEEP_SECURITY_RESULT}"; do
            [[ "${result}" == "success" ]] || { echo "Required job failed: ${result}"; exit 1; }
          done
