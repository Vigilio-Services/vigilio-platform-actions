name: platform-actions-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-actions-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'
  SEMGREP_VERSION: '1.165.0'

jobs:
  validate:
    name: Validate Platform Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Actionlint
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm governance:workflows
      - run: pnpm governance:actions
      - name: Require changeset on package code changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          CHANGED_PACKAGES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^packages/' || true)
          CHANGED_CHANGESETS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^\.changeset/[^/]+\.md$' || true)
          if [ -n "${CHANGED_PACKAGES}" ] && [ -z "${CHANGED_CHANGESETS}" ]; then
            echo "Error: Code changes detected in packages/ without a declared .changeset/*.md file."
            echo "Please run 'pnpm changeset' locally and commit the resulting file."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsecops-governance-dist
          path: packages/devsecops-governance/dist/
          retention-days: 14

  package-smoke:
    name: Package Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: mkdir -p "${GITHUB_WORKSPACE}/reports"
      - run: pnpm test:packages
      - run: node packages/devsecops-governance/dist/cli.js validate-stage-source --stage production --ref-name main

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deep-security:
    name: Deep Security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: CodeQL init
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - name: Install Semgrep
        if: success() || failure()
        run: python -m pip install semgrep==${{ env.SEMGREP_VERSION }}
      - name: Semgrep OWASP scan
        if: success() || failure()
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: ${{ always() && hashFiles('trivy-config.sarif') != '' }}
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  ci-gate:
    name: Required CI Gate
    needs: [validate, package-smoke, secret-scan, deep-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce required jobs
        shell: bash
        env:
          DEEP_SECURITY_RESULT: ${{ needs.deep-security.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          for result in "${VALIDATE_RESULT}" "${PACKAGE_SMOKE_RESULT}" "${SECRET_SCAN_RESULT}" "${DEEP_SECURITY_RESULT}"; do
            [[ "${result}" == "success" ]] || { echo "Required job failed: ${result}"; exit 1; }
          done
