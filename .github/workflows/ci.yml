name: platform-actions-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-actions-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'
  SEMGREP_VERSION: '1.165.0'

jobs:
  validate:
    name: Validate Platform Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm governance:workflows
      - run: pnpm governance:actions
      - name: Require changeset on package code changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_PACKAGES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null | grep -E '^packages/' || git diff --name-only HEAD~1...HEAD | grep -E '^packages/' || true)
          CHANGED_CHANGESETS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null | grep -E '^\.changeset/[^/]+\.md$' || git diff --name-only HEAD~1...HEAD | grep -E '^\.changeset/[^/]+\.md$' || true)
          if [ -n "${CHANGED_PACKAGES}" ] && [ -z "${CHANGED_CHANGESETS}" ]; then
            echo "Error: Code changes detected in packages/ without a declared .changeset/*.md file."
            echo "Please run 'pnpm changeset' locally and commit the resulting file."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-governance-dist
          path: packages/devsecops-governance/dist/
          retention-days: 14

  package-smoke:
    name: Package Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: mkdir -p "${GITHUB_WORKSPACE}/reports"
      - run: pnpm test:packages
      - run: node packages/devsecops-governance/dist/cli.js validate-stage-source --stage production --ref-name main

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.0"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "${archive}"
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --verbose --no-banner --redact

  deep-security:
    name: Deep Security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: CodeQL init
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      - name: Install Semgrep
        if: success() || failure()
        run: python -m pip install semgrep==${{ env.SEMGREP_VERSION }}
      - name: Semgrep OWASP scan
        if: success() || failure()
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif
      # TECH DEBT: Trivy SARIF scans use exit-code: 0 to allow full SARIF ingestion by GitHub Code Scanning before ci-gate gatekeeping.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles('trivy-config.sarif') != '' }}
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  ci-gate:
    name: Required CI Gate
    needs: [validate, package-smoke, secret-scan, deep-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce required jobs
        shell: bash
        env:
          DEEP_SECURITY_RESULT: ${{ needs.deep-security.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          for result in "${VALIDATE_RESULT}" "${PACKAGE_SMOKE_RESULT}" "${SECRET_SCAN_RESULT}" "${DEEP_SECURITY_RESULT}"; do
            [[ "${result}" == "success" ]] || { echo "Required job failed: ${result}"; exit 1; }
          done
