name: container-build-push

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: .
      dockerfile:
        type: string
        required: true
      image-repository:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      push:
        type: boolean
        required: false
        default: false
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
      trivy-version:
        type: string
        required: false
        default: v0.72.0
    secrets:
      AWS_ROLE_ARN:
        required: false
      GITHUB_PACKAGES_TOKEN:
        required: false
    outputs:
      image-digest:
        description: Immutable registry digest produced by BuildKit.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  # Required for AWS OIDC authentication and Cosign OIDC signing when push=true
  id-token: write
  packages: read
  # Required for Trivy vulnerability SARIF report upload to GitHub Security
  security-events: write

jobs:
  build:
    name: Build and verify OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Require deployment identity for pushes
        if: inputs.push
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || { echo 'An AWS OIDC role ARN is required when push=true'; exit 1; }
          [[ "${IMAGE_REPOSITORY}" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\/[a-z0-9._/-]+$ ]] || {
            echo 'image-repository must be a valid private ECR repository'
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        if: inputs.push
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: container-${{ github.run_id }}
          unset-current-credentials: true
      - uses: aws-actions/amazon-ecr-login@0c797f2390319498b40ae093716cac64da4dda2d # v2.0.1
        if: inputs.push
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ inputs.image-repository }}
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          secrets: |
            "npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}"
      - name: Scan image for vulnerabilities before signing
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ inputs.trivy-version }}
          image-ref: ${{ inputs.image-repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - name: Sign immutable digest with GitHub OIDC
        if: inputs.push
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        if: ${{ always() && inputs.push && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
