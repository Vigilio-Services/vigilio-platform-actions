name: container-build-push

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: .
      dockerfile:
        type: string
        required: true
      image-repository:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      push:
        type: boolean
        required: false
        default: false
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
    secrets:
      AWS_ROLE_ARN:
        required: false
      GITHUB_PACKAGES_TOKEN:
        required: false
    outputs:
      image-digest:
        description: Immutable registry digest produced by BuildKit.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  id-token: write
  packages: read
  security-events: write

jobs:
  build:
    name: Build and verify OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Require deployment identity for pushes
        if: inputs.push
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || { echo 'An AWS OIDC role ARN is required when push=true'; exit 1; }
          [[ "${IMAGE_REPOSITORY}" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\/[a-z0-9._/-]+$ ]] || {
            echo 'image-repository must be a valid private ECR repository'
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        if: inputs.push
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: container-${{ github.run_id }}
          unset-current-credentials: true
      - uses: aws-actions/amazon-ecr-login@d63b14614fe5d7fc5e5e52c523dea4e876816cc4 # v2.0.1
        if: inputs.push
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        id: metadata
        with:
          images: ${{ inputs.image-repository }}
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          secrets: |
            "npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - name: Sign immutable digest with GitHub OIDC
        if: inputs.push
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - name: Scan pushed image
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ inputs.image-repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: ${{ always() && inputs.push && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
