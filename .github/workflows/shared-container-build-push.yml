name: container-build-push

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: .
      source-repository:
        description: Optional owner/repository whose exact revision is overlaid into the build context.
        type: string
        required: false
        default: ''
      source-ref:
        description: Full 40 or 64 character commit SHA from source-repository.
        type: string
        required: false
        default: ''
      source-checkout-path:
        description: Workspace-relative path where the exact source revision is checked out.
        type: string
        required: false
        default: ''
      dockerfile:
        type: string
        required: true
      image-repository:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      push:
        type: boolean
        required: false
        default: false
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
      trivy-version:
        type: string
        required: false
        default: v0.72.0
      upload-sarif:
        description: Publish the Trivy SARIF report to GitHub code scanning; requires GitHub Advanced Security for private repositories.
        type: boolean
        required: false
        default: true
    secrets:
      AWS_ROLE_ARN:
        required: false
      GITHUB_PACKAGES_TOKEN:
        required: false
    outputs:
      image-digest:
        description: Immutable registry digest produced by BuildKit.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  # upload-sarif reads workflow-run metadata for private repositories.
  actions: read
  contents: read
  # Required for AWS OIDC authentication and Cosign OIDC signing when push=true
  id-token: write
  packages: read
  # Required for Trivy vulnerability SARIF report upload to GitHub Security
  security-events: write

jobs:
  build:
    name: Build and verify OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Validate exact source overlay
        if: inputs.source-repository != '' || inputs.source-ref != '' || inputs.source-checkout-path != ''
        shell: bash
        env:
          SOURCE_CHECKOUT_PATH: ${{ inputs.source-checkout-path }}
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REPOSITORY}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || {
            echo 'source-repository must use the owner/repository form'
            exit 1
          }
          [[ "${SOURCE_REF}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]] || {
            echo 'source-ref must be a full commit SHA'
            exit 1
          }
          [[ "${SOURCE_CHECKOUT_PATH}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]] || {
            echo 'source-checkout-path must stay inside the workspace'
            exit 1
          }
      - name: Checkout exact application source
        if: inputs.source-repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-ref }}
          path: ${{ inputs.source-checkout-path }}
          persist-credentials: false
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - name: Require deployment identity for pushes
        if: inputs.push
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || { echo 'An AWS OIDC role ARN is required when push=true'; exit 1; }
          [[ "${IMAGE_REPOSITORY}" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\/[a-z0-9._/-]+$ ]] || {
            echo 'image-repository must be a valid private ECR repository'
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: inputs.push
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: container-${{ github.run_id }}
          unset-current-credentials: true
      - uses: aws-actions/amazon-ecr-login@af7426afbdd3e0777aa7a889f2f55f7ad3ff7a8b # v2.0.1
        if: inputs.push
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ inputs.image-repository }}
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-ref || github.sha }}
            org.opencontainers.image.source=${{ inputs.source-repository && format('{0}/{1}', github.server_url, inputs.source-repository) || format('{0}/{1}', github.server_url, github.repository) }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && !contains(inputs.platforms, ',') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Docker exporter used by non-publishing previews cannot load the
          # manifest list emitted by BuildKit attestations. Published images keep
          # maximum provenance and SBOM attestations in the registry.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push && 'true' || 'false' }}
          secrets: |
            "npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}"
      - name: Enforce HIGH and CRITICAL container security policy
        if: inputs.push || !contains(inputs.platforms, ',')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ inputs.trivy-version }}
          image-ref: ${{ inputs.push && format('{0}@{1}', inputs.image-repository, steps.build.outputs.digest) || steps.metadata.outputs.tags }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          scanners: vuln,secret
      - name: Generate complete container security evidence
        if: ${{ always() && (inputs.push || !contains(inputs.platforms, ',')) }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ inputs.trivy-version }}
          image-ref: ${{ inputs.push && format('{0}@{1}', inputs.image-repository, steps.build.outputs.digest) || steps.metadata.outputs.tags }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0
          scanners: vuln,secret
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - name: Sign immutable digest with GitHub OIDC
        if: inputs.push
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - name: Verify keyless signature before promotion
        if: inputs.push
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        env:
          CERTIFICATE_IDENTITY_REGEXP: '^https://github\\.com/${{ github.repository_owner }}/[A-Za-z0-9_.-]+/\\.github/workflows/[A-Za-z0-9_.-]+\\.yml@.+$'
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - name: Retain container vulnerability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (inputs.push || !contains(inputs.platforms, ',')) && hashFiles('trivy-image.sarif') != '' }}
        with:
          name: trivy-container-sarif-${{ github.run_id }}
          path: trivy-image.sarif
          if-no-files-found: error
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && inputs.upload-sarif && (inputs.push || !contains(inputs.platforms, ',')) && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
