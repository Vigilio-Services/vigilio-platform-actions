name: mobile-expo-eas-build

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      platform:
        type: string
        required: false
        default: all
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      eas-version:
        type: string
        required: false
        default: '20.1.0'
      app-name:
        type: string
        required: false
        default: mobile-app
    secrets:
      EXPO_TOKEN:
        required: true
      GITHUB_PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  packages: read
  attestations: write
  id-token: write

jobs:
  build:
    name: EAS ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.profile }}
    concurrency:
      group: mobile-eas-${{ inputs.app-name }}-${{ inputs.profile }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/validate-stage-source@75312c4611668ddc16fdb303d0b756b226e027c9 # v1
        with:
          stage: ${{ inputs.profile }}
          ref-name: ${{ github.ref_name }}
      - name: Validate EAS inputs
        shell: bash
        env:
          EAS_PLATFORM: ${{ inputs.platform }}
          EAS_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "${EAS_PROFILE}" in
            development|test|staging|production) ;;
            *) echo "Unsupported EAS profile: ${EAS_PROFILE}" >&2; exit 1 ;;
          esac
          case "${EAS_PLATFORM}" in
            android|ios|all) ;;
            *) echo "Unsupported EAS platform: ${EAS_PLATFORM}" >&2; exit 1 ;;
          esac
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@75312c4611668ddc16fdb303d0b756b226e027c9 # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          github-packages-token: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
          install: false
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ inputs.eas-version }}
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm governance:package-manager
      - run: pnpm governance:github-actions
      - run: pnpm governance:env
      - run: pnpm governance:contracts
      - run: pnpm run --if-present governance:environments
      - run: pnpm expo:check
      - run: pnpm expo:doctor
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm export
      - run: pnpm export:budget
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app-name }}-${{ inputs.profile }}-dist
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 30
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ inputs.working-directory }}/dist/**
            ${{ inputs.working-directory }}/reports/sbom.cdx.json
      - name: EAS build
        env:
          EAS_PLATFORM: ${{ inputs.platform }}
          EAS_PROFILE: ${{ inputs.profile }}
        run: eas build --profile "${EAS_PROFILE}" --platform "${EAS_PLATFORM}" --non-interactive --no-wait
