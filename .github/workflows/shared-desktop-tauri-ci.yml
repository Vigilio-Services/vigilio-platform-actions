name: desktop-tauri-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.16.0'
      pnpm-version:
        type: string
        required: false
        default: '11.7.0'
      working-directory:
        type: string
        required: false
        default: .
      rust-required:
        type: boolean
        required: false
        default: true
      run-e2e:
        type: boolean
        required: false
        default: true
      rust-version:
        type: string
        required: false
        default: 'stable'

permissions:
  contents: read
  packages: read

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm governance:package-manager
      - run: pnpm governance:repository
      - run: pnpm governance:github-actions
      - run: pnpm governance:env
      - run: pnpm governance:contracts
      - run: pnpm governance:tauri
      - run: pnpm governance:testing
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm bundle:budget

  rust:
    name: Rust Checks
    needs: frontend
    if: inputs.rust-required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm rust:fmt
      - run: pnpm rust:clippy
      - run: pnpm rust:test

  e2e:
    name: Playwright Smoke
    needs: frontend
    if: inputs.run-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: Vigilio-Services/vigilio-platform-actions/actions/setup-node-pnpm@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - uses: Vigilio-Services/vigilio-platform-actions/actions/install-playwright-chromium@dc8a5002481245a1cfbfc55d9f95f1b0e8d5cd0a # v1
        with:
          working-directory: ${{ inputs.working-directory }}
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-playwright-report
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: 14
