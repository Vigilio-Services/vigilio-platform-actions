name: terraform-apply

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      working-directory:
        type: string
        required: true
      backend-config:
        type: string
        required: true
      var-file:
        type: string
        required: true
      aws-region:
        type: string
        required: false
        default: us-east-1
      aws-role-arn:
        type: string
        required: false
        default: ''
      terraform-version:
        type: string
        required: false
        default: 1.15.8
      conftest-version:
        type: string
        required: false
        default: 0.62.0
      policy-directory:
        type: string
        required: false
        default: infra/policies/conftest
      trivy-version:
        type: string
        required: false
        default: v0.72.0
    secrets:
      AWS_ROLE_ARN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Verified apply plan ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: VigilioYonatan/vigilio-platform-actions/actions/validate-stage-source@a46b75d3bdac70b49596c7dbd8aebbbc3f6bb3ab # v1
        with:
          stage: ${{ inputs.stage }}
          ref-name: ${{ github.ref_name }}
      - name: Require deployment identity and configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          BACKEND_CONFIG: ${{ inputs.backend-config }}
          STAGE: ${{ inputs.stage }}
          VAR_FILE: ${{ inputs.var-file }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || { echo 'An AWS OIDC role ARN is required'; exit 1; }
          [[ "${STAGE}" =~ ^(development|staging|production)$ ]] || { echo 'Invalid deployment stage'; exit 1; }
          [[ "${WORKING_DIRECTORY%/}" == */"${STAGE}" ]] || { echo 'Terraform working directory must match the deployment stage'; exit 1; }
          test -f "${BACKEND_CONFIG}" || { echo "Terraform backend config not found: ${BACKEND_CONFIG}"; exit 1; }
          if grep -q 'REPLACE_WITH_' "${BACKEND_CONFIG}"; then echo 'Terraform backend config still contains placeholders'; exit 1; fi
          test -f "${VAR_FILE}" || { echo "Terraform var file not found: ${VAR_FILE}"; exit 1; }
          if grep -q 'REPLACE_WITH_' "${VAR_FILE}"; then echo 'Terraform var file still contains placeholders'; exit 1; fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Prepare Terraform provider cache
        shell: bash
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ inputs.stage }}-${{ github.run_id }}
          unset-current-credentials: true
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="${BACKEND_CONFIG}"
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
      - run: terraform validate
      - name: Build exact apply plan
        run: terraform plan -input=false -lock-timeout=5m -var-file="${VAR_FILE}" -out=tfplan
        env:
          VAR_FILE: ${{ inputs.var-file }}
      - name: Render and checksum plan
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt
          sha256sum tfplan > tfplan.sha256
      - name: Install Conftest with checksum verification
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base}/${archive}"
          curl --fail --location --silent --show-error --output checksums.txt "${base}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "${archive}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
        env:
          CONFTEST_VERSION: ${{ inputs.conftest-version }}
      - run: conftest test tfplan.json --policy "${GITHUB_WORKSPACE}/${POLICY_DIRECTORY}"
        env:
          POLICY_DIRECTORY: ${{ inputs.policy-directory }}
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ inputs.trivy-version }}
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-apply-plan-${{ inputs.stage }}-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/tfplan.sha256
            ${{ inputs.working-directory }}/tfplan.txt
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply ${{ inputs.stage }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    concurrency:
      group: terraform-${{ inputs.stage }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Prepare Terraform provider cache
        shell: bash
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ inputs.stage }}-${{ github.run_id }}
          unset-current-credentials: true
      - run: terraform init -input=false -backend-config="${BACKEND_CONFIG}"
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-apply-plan-${{ inputs.stage }}-${{ github.run_id }}
          path: ${{ inputs.working-directory }}
      - name: Verify and apply the approved plan
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check tfplan.sha256
          terraform apply -input=false -auto-approve tfplan
      - name: Capture non-sensitive outputs
        if: always()
        run: terraform output -no-color > terraform-outputs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: terraform-apply-evidence-${{ inputs.stage }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/terraform-outputs.txt
          retention-days: 30
          if-no-files-found: warn
