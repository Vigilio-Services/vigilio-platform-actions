name: release-platform-packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'
  HUSKY: '0'

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:packages
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack published packages for provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p reports/packages
          pnpm --filter @vigilioyonatan/devsecops-evidence pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/devsecops-governance pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/vigilio-skills pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/node-nest-tooling pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.changesets.outputs.published == 'true'
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/platform-packages.cdx.json
      - name: Attest package provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        if: steps.changesets.outputs.published == 'true'
        with:
          subject-path: reports/packages/*.tgz
      - name: Attest package SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        if: steps.changesets.outputs.published == 'true'
        with:
          subject-path: reports/packages/*.tgz
          sbom-path: reports/platform-packages.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changesets.outputs.published == 'true'
        with:
          name: published-package-evidence
          path: |
            reports/packages/*.tgz
            reports/platform-packages.cdx.json
          if-no-files-found: error
          retention-days: 90
