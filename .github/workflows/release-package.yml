name: release-platform-packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:packages
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack published packages for provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p reports/packages
          pnpm --filter @vigilioyonatan/devsecops-evidence pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/devsecops-governance pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/vigilio-skills pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          pnpm --filter @vigilioyonatan/node-nest-tooling pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.changesets.outputs.published == 'true'
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/platform-packages.cdx.json
      - name: Attest package provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        if: steps.changesets.outputs.published == 'true'
        with:
          subject-path: reports/packages/*.tgz
      - name: Attest package SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        if: steps.changesets.outputs.published == 'true'
        with:
          subject-path: reports/packages/*.tgz
          sbom-path: reports/platform-packages.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changesets.outputs.published == 'true'
        with:
          name: published-package-evidence
          path: |
            reports/packages/*.tgz
            reports/platform-packages.cdx.json
          if-no-files-found: error
          retention-days: 90
