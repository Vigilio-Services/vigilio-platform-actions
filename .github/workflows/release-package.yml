name: release-platform-packages

on:
  workflow_run:
    workflows: [platform-actions-ci]
    types: [completed]
    # Release only after CI for the protected default branch.
    # The job also verifies the original event and repository identity.
    branches: [main]

permissions: {}

concurrency:
  group: release-platform-packages
  cancel-in-progress: false

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'
  HUSKY: '0'

jobs:
  publish:
    name: Publish Package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      # `publish` above accepts only a successful push from this repository's default branch.
      # Use that verified SHA so a later push cannot replace the reviewed release contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6; nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:packages
      - name: Validate release bot configuration
        shell: bash
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${RELEASE_APP_CLIENT_ID}" ]] || {
            echo '::error::Missing production environment variable RELEASE_APP_CLIENT_ID'
            exit 1
          }
          [[ -n "${RELEASE_APP_PRIVATE_KEY}" ]] || {
            echo '::error::Missing production environment secret RELEASE_APP_PRIVATE_KEY'
            exit 1
          }
      - name: Mint least-privilege release token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack published packages for provenance
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          mkdir -p reports/packages
          echo "$PUBLISHED_PACKAGES" | jq -e 'type == "array" and length > 0'
          echo "$PUBLISHED_PACKAGES" | jq -r '.[].name' | while IFS= read -r package_name; do
            pnpm --filter "$package_name" pack --pack-destination "$GITHUB_WORKSPACE/reports/packages"
          done
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.changesets.outputs.published == 'true'
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/platform-packages.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changesets.outputs.published == 'true'
        with:
          name: published-package-evidence
          path: |
            reports/packages/*.tgz
            reports/platform-packages.cdx.json
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest Published Packages
    needs: publish
    # GitHub cannot persist attestations for user-owned private repositories.
    # Public repositories attest by default. Private repositories may opt in only
    # after their GitHub plan supports it by setting this repository variable.
    if: >-
      needs.publish.outputs.published == 'true' &&
      (github.event.repository.visibility == 'public' ||
      vars.PACKAGE_ATTESTATIONS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-package-evidence
          path: reports
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: reports/packages/*.tgz
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: reports/packages/*.tgz
          sbom-path: reports/platform-packages.cdx.json

  report-attestation-unavailable:
    name: Record attestation availability
    needs: publish
    if: >-
      needs.publish.outputs.published == 'true' &&
      github.event.repository.visibility != 'public' &&
      vars.PACKAGE_ATTESTATIONS_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record GitHub attestation limitation
        run: |
          echo "::warning::Package attestations are disabled for this private repository. Enable PACKAGE_ATTESTATIONS_ENABLED only after GitHub confirms support for this repository."
          {
            echo '## Package provenance availability'
            echo
            echo 'GitHub does not persist attestations for this private repository by default.'
            echo 'The package was published and release evidence was retained.'
            echo 'Public repositories attest automatically.'
            echo 'Set PACKAGE_ATTESTATIONS_ENABLED=true only when this private repository supports GitHub artifact attestations.'
          } >> "$GITHUB_STEP_SUMMARY"
