name: mobile-expo-security

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: .
      semgrep-version:
        type: string
        required: false
        default: '1.165.0'
      trivy-version:
        type: string
        required: false
        default: v0.72.0

permissions:
  contents: read

jobs:
  security:
    name: Mobile Security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
      # Required to upload CodeQL, Semgrep, and Trivy SARIF security scan reports
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflows
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          fail_level: error
      - name: Scan secrets
        run: |
          docker run --rm --network=none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner /repo
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Install pinned Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan OWASP mobile source patterns
        env:
          SOURCE_PATH: ${{ inputs.working-directory }}
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif --error "${SOURCE_PATH}"
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: sarif
          output: trivy-mobile.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          version: ${{ inputs.trivy-version }}
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && hashFiles('trivy-mobile.sarif') != '' }}
        with:
          sarif_file: trivy-mobile.sarif
