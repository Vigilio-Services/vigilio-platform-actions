name: mobile-expo-security

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: .
      semgrep-version:
        type: string
        required: false
        default: '1.165.0'
      trivy-version:
        type: string
        required: false
        default: v0.72.0

permissions:
  contents: read

jobs:
  security:
    name: Mobile Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
      # Required to upload CodeQL, Semgrep, and Trivy SARIF security scan reports
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflows
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          fail_level: error
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Install pinned Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan OWASP mobile source patterns
        env:
          SOURCE_PATH: ${{ inputs.working-directory }}
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif --error "${SOURCE_PATH}"
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: sarif
          output: trivy-mobile.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          version: ${{ inputs.trivy-version }}
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ always() && hashFiles('trivy-mobile.sarif') != '' }}
        with:
          sarif_file: trivy-mobile.sarif
