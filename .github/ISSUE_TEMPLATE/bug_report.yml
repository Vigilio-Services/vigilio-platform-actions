name: Bug report
description: Reportar un fallo en workflows, actions o governance package.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Que fallo y en que repo consumidor.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia CI
      description: Link al run, job y logs relevantes sin secretos.
    validations:
      required: true
