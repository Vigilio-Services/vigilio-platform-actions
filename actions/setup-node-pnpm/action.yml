name: Setup Node pnpm
description: Setup Node.js, pnpm and dependency cache with secure defaults.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: '24.16.0'
  pnpm-version:
    description: pnpm version.
    required: false
    default: '11.7.0'
  cache-dependency-path:
    description: Lockfile or workspace file used by setup-node cache.
    required: false
    default: pnpm-lock.yaml
  install:
    description: Run pnpm install.
    required: false
    default: 'true'
  github-packages-token:
    description: Optional token used to authenticate npm.pkg.github.com before install.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Configure GitHub Packages auth
      if: inputs.github-packages-token != ''
      shell: bash
      env:
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-packages-token }}
      run: printf "//npm.pkg.github.com/:_authToken=%s\n" "${GITHUB_PACKAGES_TOKEN}" >> "${HOME}/.npmrc"
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
