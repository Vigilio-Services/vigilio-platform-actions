name: Install Playwright Chromium
description: Install only Chromium for fast Playwright browser checks.

inputs:
  working-directory:
    description: Consumer directory containing package.json and pnpm-lock.yaml.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Cache Playwright Chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          playwright-chromium-${{ runner.os }}-
    - name: Install Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec playwright install --with-deps chromium
