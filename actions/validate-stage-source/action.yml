name: Validate Stage Source
description: Validate that a deployment stage runs from the expected trunk branch.

inputs:
  stage:
    description: Target stage.
    required: true
  ref-name:
    description: GitHub ref name.
    required: true
  allow-release-for-staging:
    description: Deprecated. Trunk-based mode only allows main for shared environments.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate branch to stage
      shell: bash
      run: |
        set -euo pipefail
        stage="${{ inputs.stage }}"
        ref_name="${{ inputs.ref-name }}"
        case "${stage}" in
          development|test|staging|preproduction|production)
            [[ "${ref_name}" == "main" ]] || { echo "${stage} must run from main in trunk-based mode."; exit 1; }
            ;;
          *)
            echo "Unsupported stage: ${stage}"
            exit 1
            ;;
        esac
